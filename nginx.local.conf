# HTTP-only nginx config for the LOCAL stack (docker-compose.local.yml).
# The production nginx.conf requires Let's Encrypt certificates and will not
# start on a dev machine — this file gives local deploys a working proxy
# without TLS (QA-BUG-REPORT.md D3).

upstream bugradar {
    server app:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ingestion:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://bugradar;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /ingest {
        limit_req zone=ingestion burst=30 nodelay;

        proxy_pass http://bugradar;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /sdk {
        proxy_pass http://bugradar;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://bugradar;
        proxy_http_version 1.1;

        # Only ask for an upgrade when the client did ($http_upgrade is empty
        # otherwise — a static "upgrade" would kill upstream keepalive, D4)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
