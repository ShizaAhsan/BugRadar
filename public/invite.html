<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugRadar - Accept Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e4e4e7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 20px; padding: 48px; border: 1px solid #27273a; max-width: 440px; width: 90%; text-align: center; }
    .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 32px; }
    .btn { display: inline-block; background: linear-gradient(135deg, #3b82f6, #06b6d4); color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; font-size: 15px; width: 100%; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid #27273a; color: #a1a1aa; margin-top: 12px; }
    .btn-outline:hover { border-color: #3b82f6; color: #3b82f6; }
    .error { color: #ef4444; font-size: 14px; margin-top: 16px; }
    .success { color: #10b981; font-size: 14px; margin-top: 16px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BugRadar</div>
    <div id="loading-state">
      <div class="spinner"></div>
      <p style="margin-top: 16px; color: #a1a1aa;">Processing invitation...</p>
    </div>
    <div id="login-state" style="display: none;">
      <h2 style="font-size: 20px; margin-bottom: 8px;">You're Invited!</h2>
      <p style="color: #a1a1aa; margin-bottom: 24px;">Log in to accept this invitation</p>
      <a href="/login.html" class="btn">Log In to Accept</a>
    </div>
    <div id="success-state" style="display: none;">
      <h2 style="font-size: 20px; margin-bottom: 8px; color: #10b981;">Welcome!</h2>
      <p style="color: #a1a1aa; margin-bottom: 24px;">You've been added to the organization</p>
      <a href="/dashboard.html" class="btn">Go to Dashboard</a>
    </div>
    <div id="error-state" style="display: none;">
      <h2 style="font-size: 20px; margin-bottom: 8px; color: #ef4444;">Invitation Error</h2>
      <p class="error" id="error-message">This invitation is invalid or has expired.</p>
      <a href="/login.html" class="btn" style="margin-top: 16px;">Go to Login</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    async function acceptInvitation() {
      try {
        document.getElementById('loading-state').style.display = 'block';
        document.getElementById('login-state').style.display = 'none';
        document.getElementById('error-state').style.display = 'none';

        // httpOnly cookie is the primary credential (C13); a Bearer token is only
        // an optional fallback when one exists in localStorage (M2 keeps it fresh)
        const headers = { 'Accept': 'application/json' };
        const storedToken = localStorage.getItem('br_token');
        if (storedToken) headers['Authorization'] = 'Bearer ' + storedToken;

        const res = await fetch('/api/invitations/accept/' + token, {
          headers,
          credentials: 'include',
        });

        if (res.redirected) {
          window.location.href = res.url;
          return;
        }

        const data = await res.json().catch(() => null);

        if (res.ok && data && data.success) {
          localStorage.removeItem('br_invite_token');
          document.getElementById('loading-state').style.display = 'none';
          document.getElementById('success-state').style.display = 'block';
        } else if ((data && data.code === 'LOGIN_REQUIRED') || res.status === 401) {
          // Not signed in yet — remember the invite; app.js resumes it after login
          localStorage.setItem('br_invite_token', token);
          document.getElementById('loading-state').style.display = 'none';
          document.getElementById('login-state').style.display = 'block';
        } else {
          showError((data && data.error) || 'Failed to accept invitation');
        }
      } catch (err) {
        showError('Failed to accept invitation');
      }
    }

    if (!token) {
      showError('No invitation token provided');
    } else {
      acceptInvitation();
    }

    function showError(msg) {
      // Terminal failure (expired/invalid) — don't loop back here after next login
      localStorage.removeItem('br_invite_token');
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('login-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
      document.getElementById('error-message').textContent = msg;
    }
  </script>
</body>
</html>
