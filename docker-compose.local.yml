services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bugradar

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-bugradar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bugradar_secret}
      POSTGRES_DB: ${DB_NAME:-bugradar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bugradar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bugradar

  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      # CMD-SHELL so the `-a <password>` becomes two argv tokens; the old CMD
      # form passed "-a secret" as ONE argument and redis-cli never authenticated
      # → container never healthy → app never started (QA-BUG-REPORT.md D3)
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bugradar

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # HTTP-only local config — the production nginx.conf reads Let's Encrypt
      # certs that don't exist locally and crash-loops (QA-BUG-REPORT.md D3)
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - bugradar

volumes:
  postgres_data:
  redis_data:

networks:
  bugradar:
    driver: bridge
