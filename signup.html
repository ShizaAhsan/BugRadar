<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — BugRadar™</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- External Global Master CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================================================================= -->
    <!-- FIXED CORNER GRAPHICS (TOP LEFT & DOWN RIGHT ROTATED)             -->
    <!-- ================================================================= -->
    <img src="glass_knot.png" alt="Glass Knot Top Left" class="bg-orb-top-left">
    <img src="glass_knot.png" alt="Glass Knot Down Right Rotated" class="bg-orb-down-right">
    <div class="bg-ambient-aura"></div>

    <!-- ================================================================= -->
    <!-- TOP BRANDING & NAVIGATION                                         -->
    <!-- ================================================================= -->
    <nav class="top-nav">
        <a href="index.html" class="brand-logo">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/>
                    <path d="M4.93 19.07A10 10 0 0 0 17.01 20.66"/>
                    <path d="M2 12h20"/>
                    <path d="M12 2v20"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <span>BugRadar</span>
        </a>

        <a href="index.html" class="back-home-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Home</span>
        </a>
    </nav>

    <!-- ================================================================= -->
    <!-- CENTER SIGN UP CARD                                               -->
    <!-- ================================================================= -->
    <main class="main-container" style="max-width: 440px; padding-top: 40px; padding-bottom: 40px;">
        <div class="card-box">
            
            <!-- Card Header -->
            <div class="card-header">
                <h1 class="card-title">Create your account</h1>
                <p class="card-subtitle">Performance meets scale. Get started with error tracking in under 2 minutes.</p>
            </div>

            <!-- Sign Up Form -->
            <form id="signup-form" onsubmit="handleSignUpSubmit(event)" style="display: flex; flex-direction: column; gap: var(--space-4);">
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullname" class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="fullname" 
                            name="fullname" 
                            class="form-input" 
                            placeholder="Sarah Jenkins" 
                            required 
                            autocomplete="name"
                        >
                        <span class="input-icon-btn" title="Full Name">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Work Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">Work Email</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="sarah@company.com" 
                            required 
                            autocomplete="email"
                        >
                        <span class="input-icon-btn" title="Work Email">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Organization Name Field -->
                <div class="form-group">
                    <label for="orgname" class="form-label">Organization Name</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="orgname" 
                            name="orgname" 
                            class="form-input" 
                            placeholder="Acme Corp" 
                            required
                        >
                        <span class="input-icon-btn" title="Organization">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="16" height="20" x="4" y="2" rx="2" ry="2"></rect>
                                <path d="M9 22v-4h6v4"></path>
                                <path d="M8 6h.01"></path>
                                <path d="M16 6h.01"></path>
                                <path d="M12 6h.01"></path>
                                <path d="M8 10h.01"></path>
                                <path d="M8 14h.01"></path>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••••••" 
                            required 
                            autocomplete="new-password"
                            oninput="updatePasswordStrength(this.value)"
                        >
                        <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <!-- Password strength meter (styles in style.css) -->
                    <div class="password-strength-bar">
                        <div class="password-strength-fill" id="strength-fill"></div>
                    </div>
                </div>

                <!-- Terms and Privacy Checkbox -->
                <div class="terms-row">
                    <input type="checkbox" id="terms" class="terms-checkbox" required>
                    <label for="terms">
                        I agree to BugRadar's <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>.
                    </label>
                </div>

                <!-- Primary Create Account CTA -->
                <button type="submit" class="btn-primary" id="signup-btn">
                    <span>Create Account & Workspace</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>Already have an account?</span>
            </div>

            <!-- Secondary Log In Button Link -->
            <a href="login.html" class="btn-secondary">
                Log In
            </a>

        </div>
    </main>

    <!-- Footer Caption -->
    <footer class="card-footer-text">
        <p>© 2026 BugRadar Inc. All rights reserved.</p>
    </footer>

    <!-- External Global Master JS File -->
    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
