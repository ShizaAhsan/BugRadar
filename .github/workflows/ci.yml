name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bugradar
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bugradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # D5: the old CI ran `npm test` (an echo) — provision the database and a
      # live server, then run the actual integration suite.
      - name: Run database migrations
        run: npm run migrate
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: bugradar
          DB_PASSWORD: test_password
          DB_NAME: bugradar_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef0123456789

      - name: Seed demo data
        run: npm run seed
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: bugradar
          DB_PASSWORD: test_password
          DB_NAME: bugradar_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef0123456789

      - name: Start server
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start:"
          cat server.log
          exit 1
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: bugradar
          DB_PASSWORD: test_password
          DB_NAME: bugradar_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef0123456789
          WEBHOOK_SECRET: test-webhook-secret-0123456789abcdef01234567

      - name: Run integration tests
        run: npm test
        env:
          BASE_URL: http://localhost:3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: bugradar
          DB_PASSWORD: test_password
          DB_NAME: bugradar_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-0123456789abcdef0123456789
          JWT_REFRESH_SECRET: test-refresh-secret-0123456789abcdef0123456789

      - name: Server log on failure
        if: failure()
        run: cat server.log || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e

            cd /home/ubuntu/BugRadar

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Rebuilding application..."
            docker compose up -d --build

            echo "Running database migrations..."
            docker compose exec -T app node server/migrations/run.js

            echo "Checking container status..."
            docker compose ps

            # The production stack does not publish the app port (nginx fronts
            # it on 80/443), and a plain HTTP request to port 80 is answered by
            # nginx's 301 redirect — which curl -f counts as success. Poll the
            # app's real health endpoint (verifies DB + Redis) instead.
            echo "Waiting for application health..."
            for i in $(seq 1 30); do
              if docker compose exec -T app wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q '"status":"ok"'; then
                echo "Application healthy!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Application failed to become healthy"
                docker compose logs --tail=50 app
                exit 1
              fi
              sleep 2
            done

            echo "Deployment successful!"
