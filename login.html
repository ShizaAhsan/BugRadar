<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — BugRadar™</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- External Global Master CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================================================================= -->
    <!-- FIXED CORNER GRAPHICS (TOP LEFT & DOWN RIGHT ROTATED)             -->
    <!-- ================================================================= -->
    <img src="glass_knot.png" alt="Glass Knot Top Left" class="bg-orb-top-left">
    <img src="glass_knot.png" alt="Glass Knot Down Right Rotated" class="bg-orb-down-right">
    <div class="bg-ambient-aura"></div>

    <!-- ================================================================= -->
    <!-- TOP BRANDING & NAVIGATION                                         -->
    <!-- ================================================================= -->
    <nav class="top-nav">
        <a href="index.html" class="brand-logo">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/>
                    <path d="M4.93 19.07A10 10 0 0 0 17.01 20.66"/>
                    <path d="M2 12h20"/>
                    <path d="M12 2v20"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <span>BugRadar</span>
        </a>

        <a href="index.html" class="back-home-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Home</span>
        </a>
    </nav>

    <!-- ================================================================= -->
    <!-- CENTER LOGIN CARD                                                 -->
    <!-- ================================================================= -->
    <main class="main-container">
        <div class="card-box">
            
            <!-- Card Header -->
            <div class="card-header">
                <h1 class="card-title">Log In to BugRadar</h1>
                <p class="card-subtitle">Performance meets scale. Enter your credentials to access your workspace.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)" style="display: flex; flex-direction: column; gap: var(--space-4);">
                
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">Your Email</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="name@company.com" 
                            required 
                            autocomplete="email"
                        >
                        <span class="input-icon-btn" title="User Email">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">Your Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="input-icon-btn" id="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password Row -->
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" class="remember-checkbox" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgotten?</a>
                </div>

                <!-- Primary Log In CTA -->
                <button type="submit" class="btn-primary" id="login-btn">
                    <span>Log In</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>Don't have an account?</span>
            </div>

            <!-- Secondary Sign Up Button Link -->
            <a href="signup.html" class="btn-secondary">
                Sign Up
            </a>

        </div>
    </main>

    <!-- Footer Caption -->
    <footer class="card-footer-text">
        <p>© 2026 BugRadar Inc. All rights reserved.</p>
    </footer>

    <!-- External Global Master JS File -->
    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
